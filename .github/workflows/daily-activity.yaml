name: Daily Org GitHub Activity & Languages Collector

on:
  schedule:
    # Runs at 00:30 UTC daily (06:00 IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect GitHub Activity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'pid7-org' }}
        run: npm run github:activity -- --incremental --days 7

      - name: Collect GitHub Languages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'pid7-org' }}
        run: npm run github:languages

      - name: Collect GitHub Projects
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'pid7-org' }}
        run: npm run github:projects

      - name: Commit and push updated datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/gh-activity.json src/assets/gh-languages.json src/assets/gh-projects.json

          if git diff --cached --quiet; then
            echo "No data updates to commit."
          else
            git commit -m "feat(data): update org github activity, languages & projects datasets [skip ci]"
            git push
          fi
